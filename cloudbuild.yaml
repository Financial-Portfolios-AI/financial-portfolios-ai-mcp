steps:
  # 1. Build container image from parent workspace root
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/financial-portfolios-ai-mcp:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/financial-portfolios-ai-mcp:latest'
      - '-f'
      - 'financial-portfolios-ai-mcp/Dockerfile'
      - '.'

  # 2. Push image to Google Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/financial-portfolios-ai-mcp:$COMMIT_SHA'

  # 3. Deploy to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'financial-portfolios-ai-mcp'
      - '--image'
      - 'gcr.io/$PROJECT_ID/financial-portfolios-ai-mcp:$COMMIT_SHA'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'FINANCIAL_PORTFOLIOS_BASE_URL=https://financial-portfolios.ai,MCP_LOG_LEVEL=INFO'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'

substitutions:
  _REGION: 'us-central1'

images:
  - 'gcr.io/$PROJECT_ID/financial-portfolios-ai-mcp:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/financial-portfolios-ai-mcp:latest'
