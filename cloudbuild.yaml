# The target deployment is chosen here, at deploy time, and nowhere in the code:
#   gcloud builds submit --substitutions=_ENV=dev
#   gcloud builds submit --substitutions=_ENV=prod
# There is no default. Step 0 stops the build before anything is pushed if _ENV is missing.
steps:
  # 0. Refuse to build without a target
  - name: 'bash'
    script: |
      case "${_ENV}" in
        dev|prod) echo "Deploying to ${_ENV}" ;;
        *) echo "Set _ENV to dev or prod: gcloud builds submit --substitutions=_ENV=dev" >&2; exit 1 ;;
      esac

  # 1. Build container image from parent workspace root
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/financial-portfolios-ai-mcp:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/financial-portfolios-ai-mcp:latest'
      - '-f'
      - 'financial-portfolios-ai-mcp/Dockerfile'
      - '.'

  # 2. Push image to Google Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/financial-portfolios-ai-mcp:$COMMIT_SHA'

  # 3. Deploy to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'financial-portfolios-ai-mcp'
      - '--image'
      - 'gcr.io/$PROJECT_ID/financial-portfolios-ai-mcp:$COMMIT_SHA'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      # OAUTH_AUTHORIZATION_SERVER + MCP_PUBLIC_URL are advertised in
      # /.well-known/oauth-protected-resource (RFC 9728) so marketplace/directory
      # clients discover the portal authorization server and this resource. They
      # must be the PUBLIC portal origin, not localhost (ADR-0196/0198).
      # FINANCIAL_PORTFOLIOS_ENV makes the server derive every public URL it advertises (portal
      # API, OAuth issuer, MCP resource URL, /assets icons) from the named deployment.
      - '--set-env-vars'
      - 'FINANCIAL_PORTFOLIOS_ENV=${_ENV},MCP_PUBLIC_BASE_URL=${_MCP_PUBLIC_BASE_URL},MCP_LOG_LEVEL=${_LOG_LEVEL}'
      # The /sse transport holds long-lived streaming connections. Cloud Run's own
      # request timeout must be >= the LB backend timeout (mcp_backend_timeout_sec,
      # 3600s in mcp_edge.tf) or the edge would cut streams short.
      - '--timeout'
      - '3600'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'

substitutions:
  _REGION: 'us-central1'
  # Target deployment: dev or prod. Deliberately empty - see the top of this file.
  _ENV: ''
  # Origin that serves this server's /assets icons, when it differs from the deployment's
  # own origin (e.g. the Cloud Run run.app URL). Empty means derive it from _ENV.
  _MCP_PUBLIC_BASE_URL: ''
  _LOG_LEVEL: 'INFO'

images:
  - 'gcr.io/$PROJECT_ID/financial-portfolios-ai-mcp:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/financial-portfolios-ai-mcp:latest'
