steps:
  # 1. Build container image from parent workspace root
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/financial-portfolios-ai-mcp:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/financial-portfolios-ai-mcp:latest'
      - '-f'
      - 'financial-portfolios-ai-mcp/Dockerfile'
      - '.'

  # 2. Push image to Google Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/financial-portfolios-ai-mcp:$COMMIT_SHA'

  # 3. Deploy to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'financial-portfolios-ai-mcp'
      - '--image'
      - 'gcr.io/$PROJECT_ID/financial-portfolios-ai-mcp:$COMMIT_SHA'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      # OAUTH_AUTHORIZATION_SERVER + MCP_PUBLIC_URL are advertised in
      # /.well-known/oauth-protected-resource (RFC 9728) so marketplace/directory
      # clients discover the portal authorization server and this resource. They
      # must be the PUBLIC portal origin, not localhost (ADR-0196/0198).
      # Every public URL this server advertises (portal API, OAuth issuer, MCP
      # resource URL, and the /assets icon URLs) is derived from _PORTAL_ORIGIN, so
      # a dev deployment advertises dev URLs without any code or manifest edit:
      #   gcloud builds submit --substitutions=_PORTAL_ORIGIN=https://dev.financial-portfolios.ai
      - '--set-env-vars'
      - 'FINANCIAL_PORTFOLIOS_BASE_URL=${_PORTAL_ORIGIN},OAUTH_AUTHORIZATION_SERVER=${_PORTAL_ORIGIN},MCP_PUBLIC_URL=${_PORTAL_ORIGIN}/mcp,MCP_PUBLIC_BASE_URL=${_MCP_PUBLIC_BASE_URL},MCP_LOG_LEVEL=${_LOG_LEVEL}'
      # The /sse transport holds long-lived streaming connections. Cloud Run's own
      # request timeout must be >= the LB backend timeout (mcp_backend_timeout_sec,
      # 3600s in mcp_edge.tf) or the edge would cut streams short.
      - '--timeout'
      - '3600'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'

substitutions:
  _REGION: 'us-central1'
  # Public origin of the environment being deployed (prod by default; pass
  # https://dev.financial-portfolios.ai for the dev environment).
  _PORTAL_ORIGIN: 'https://financial-portfolios.ai'
  # Origin that serves this server's /assets icons. Defaults to the portal origin,
  # which proxies /assets and /mcp; override when the MCP service is reached on its
  # own hostname (e.g. the Cloud Run run.app URL) instead of through the portal.
  _MCP_PUBLIC_BASE_URL: 'https://financial-portfolios.ai'
  _LOG_LEVEL: 'INFO'

images:
  - 'gcr.io/$PROJECT_ID/financial-portfolios-ai-mcp:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/financial-portfolios-ai-mcp:latest'
