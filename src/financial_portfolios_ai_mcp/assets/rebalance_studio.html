<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rebalance Studio</title>
<style>
  :root {
    --bg: var(--color-background-primary, #ffffff); --panel: var(--color-background-secondary, #f6f7fb);
    --line: var(--color-border-primary, #e3e6ef); --text: var(--color-text-primary, #16182b);
    --muted: var(--color-text-secondary, #5d6275);
    --accent: #0e9fb0; --accent-soft: rgba(14,159,176,.12); --violet: #6a4bd6;
    --warn-bg: #fff5e6; --warn-text: #8a4b00; --warn-line: #f3c98b;
    --buy: #0f8a5f; --sell: #c0392b;
  }
  :root[data-theme="dark"] {
    --bg: var(--color-background-primary, #111322); --panel: var(--color-background-secondary, #181b2e);
    --line: var(--color-border-primary, #2a2e47); --text: var(--color-text-primary, #e9ebf5);
    --muted: var(--color-text-secondary, #9aa0b8);
    --accent: #3ee6f0; --accent-soft: rgba(62,230,240,.12); --violet: #9b85ff;
    --warn-bg: #2b2111; --warn-text: #f5c77e; --warn-line: #5a4320;
    --buy: #45d39b; --sell: #ff7a6b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 var(--font-sans, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif); }
  .wrap { padding: 16px; }
  header { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
  h1 { font-size: 15px; margin: 0; font-weight: 650; letter-spacing: .2px; }
  h2 { font-size: 13px; margin: 18px 0 8px; font-weight: 650; }
  .step { display: inline-flex; align-items: center; justify-content: center; width: 19px; height: 19px;
    border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 11.5px;
    font-weight: 700; margin-right: 7px; }
  .actions { display: flex; gap: 6px; margin-left: auto; }
  .action { font: inherit; font-size: 12.5px; color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 11px; cursor: pointer; white-space: nowrap; }
  .action.primary { background: var(--accent); border-color: var(--accent); color: #04232a; font-weight: 650; }
  .action[disabled] { opacity: .5; cursor: default; }
  @media (hover: hover) { .action:not([disabled]):hover { border-color: var(--accent); } }
  .action:focus-visible, select:focus, textarea:focus, input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  select, textarea, input { font: inherit; color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; max-width: 100%; }
  textarea { width: 100%; min-height: 104px; resize: vertical; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
  .badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .badge.live { background: var(--accent-soft); color: var(--accent); }
  .meta { color: var(--muted); font-size: 12px; }
  .note { color: var(--muted); font-size: 11.5px; margin-top: 8px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 8px; margin-top: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; }
  .card .k { color: var(--muted); font-size: 11.5px; }
  .card .v { font-size: 18px; font-weight: 650; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .banner { margin-top: 12px; padding: 9px 12px; border-radius: 8px; font-size: 12.5px;
    background: var(--warn-bg); color: var(--warn-text); border: 1px solid var(--warn-line); }
  .tablebox { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; margin-top: 8px; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; background: var(--panel); }
  td.num, th.num { text-align: right; }
  tr:last-child td { border-bottom: 0; }
  tr.bad td { background: var(--warn-bg); color: var(--warn-text); }
  .buy { color: var(--buy); font-weight: 650; }
  .sell { color: var(--sell); font-weight: 650; }
  .empty, .error { padding: 16px; text-align: center; color: var(--muted); }
  .error { color: var(--sell); }
  .toast { position: fixed; right: 12px; bottom: 12px; font-size: 12px; color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; box-shadow: 0 2px 8px rgba(0,0,0,.12); z-index: 10; }
  .toast:empty { display: none; }
  footer { margin-top: 18px; padding-top: 10px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11.5px; }
  @media (pointer: coarse) { .action { min-height: 44px; padding: 11px 14px; } select, input { min-height: 44px; } th, td { padding: 11px 10px; } }
  html[data-touch="true"] .action { min-height: 44px; padding: 11px 14px; }
  html[data-touch="true"] select, html[data-touch="true"] input { min-height: 44px; }
  html[data-touch="true"] th, html[data-touch="true"] td { padding: 11px 10px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Rebalance Studio</h1>
    <span id="asof" class="meta"></span>
    <div class="actions">
      <span id="toast" class="toast" role="status" aria-live="polite"></span>
      <button id="ask" class="action" type="button" hidden>Ask about this</button>
      <button id="expand" class="action" type="button" hidden>Expand</button>
    </div>
  </header>

  <div id="gate" class="banner" hidden></div>

  <h2><span class="step">1</span>Target model</h2>
  <div class="row">
    <label class="meta" for="portfolio">Align to</label>
    <select id="portfolio" aria-label="Target model portfolio"><option>Loading…</option></select>
  </div>

  <h2><span class="step">2</span>Your holdings</h2>
  <div class="meta">Paste from a spreadsheet or a broker export - one row per holding, <strong>ticker</strong> and <strong>quantity</strong>. Commas or tabs both work, a header row is optional, and <code>CASH</code> is a valid ticker.</div>
  <textarea id="holdings" spellcheck="false" placeholder="AAPL,40&#10;MSFT,25&#10;CASH,1500"></textarea>
  <div class="row" style="margin-top:8px">
    <button id="calc" class="action primary" type="button" disabled>Calculate alignment</button>
    <button id="clear" class="action" type="button">Clear</button>
    <span id="parsed" class="meta"></span>
  </div>
  <div id="preview"></div>

  <div id="result"></div>
  <footer id="disclaimer"></footer>
</div>

<script>
(() => {
  "use strict";

  // ---------------------------------------------------------------------------
  // Host bridge: MCP Apps JSON-RPC over postMessage (ext-apps spec).
  // ---------------------------------------------------------------------------
  let nextId = 1;
  const pending = new Map();
  let canCallTools = false;
  let hostCaps = {};
  const hostCtx = {};

  function send(message) { window.parent.postMessage(message, "*"); }
  function request(method, params) {
    const id = nextId++;
    send({ jsonrpc: "2.0", id, method, params });
    return new Promise((resolve, reject) => pending.set(id, { resolve, reject }));
  }
  function notify(method, params) { send({ jsonrpc: "2.0", method, params }); }

  window.addEventListener("message", (event) => {
    if (event.source !== window.parent) return;
    const m = event.data;
    if (!m || m.jsonrpc !== "2.0") return;
    if (m.id !== undefined && pending.has(m.id) && !m.method) {
      const { resolve, reject } = pending.get(m.id);
      pending.delete(m.id);
      m.error ? reject(new Error(m.error.message || "Host error")) : resolve(m.result);
      return;
    }
    switch (m.method) {
      case "ui/notifications/tool-result": onToolResult(m.params); break;
      case "ui/notifications/host-context-changed": applyContext(m.params); break;
      default:
        if (m.id !== undefined && m.method) send({ jsonrpc: "2.0", id: m.id, result: {} });
    }
  });

  function applyContext(ctx) {
    if (!ctx) return;
    Object.assign(hostCtx, ctx);
    if (ctx.theme === "dark" || ctx.theme === "light") document.documentElement.dataset.theme = ctx.theme;
    const device = ctx.deviceCapabilities;
    if (device && typeof device === "object" && typeof device.touch === "boolean") {
      document.documentElement.dataset.touch = String(device.touch);
    }
    const vars = ctx.styles && ctx.styles.variables;
    if (vars && typeof vars === "object") {
      Object.entries(vars).forEach(([name, value]) => {
        if (/^--[a-z0-9-]{1,64}$/.test(name) && typeof value === "string" && value.length < 200 && !/url\(|expression\(/i.test(value)) {
          document.documentElement.style.setProperty(name, value);
        }
      });
    }
    renderActions();
  }

  function logToHost(level, message) {
    if (hostCaps.logging) notify("notifications/message", { level, message: String(message).slice(0, 500) });
  }

  function parseResult(result) {
    if (!result) throw new Error("No result");
    let data = null;
    const block = (result.content || []).find((c) => c.type === "text" && typeof c.text === "string");
    if (block) { try { data = JSON.parse(block.text); } catch (_) { data = null; } }
    if (data === null && result.structuredContent) {
      const sc = result.structuredContent;
      data = typeof sc.result === "string" ? JSON.parse(sc.result) : sc;
    }
    if (data === null) throw new Error(block ? block.text : "Empty result");
    if (result.isError || data.error) throw new Error(data.message || data.error || "Request failed");
    return data;
  }

  async function callTool(name, args) {
    if (!canCallTools) throw new Error("This app can't run the calculation in this client.");
    try {
      return parseResult(await request("tools/call", { name, arguments: args }));
    } catch (err) {
      logToHost("error", `${name} failed: ${err.message}`);
      throw err;
    }
  }

  // ---------------------------------------------------------------------------
  // Helpers
  // ---------------------------------------------------------------------------
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const isNum = (v) => typeof v === "number" && Number.isFinite(v);
  const num = (v, d = 2) => isNum(v) ? v.toLocaleString(undefined, { maximumFractionDigits: d }) : "—";

  const state = { portfolios: [], selected: null, limits: { max_rows: 200 }, rows: [], result: null, prefilled: false };

  function toast(message) {
    $("toast").textContent = message;
    setTimeout(() => { if ($("toast").textContent === message) $("toast").textContent = ""; }, 3000);
  }

  // ---------------------------------------------------------------------------
  // Parsing a paste
  //
  // Accepts what people actually have: a spreadsheet copy (tabs), a broker CSV
  // (commas, often with a header and quoted values), or typed lines. Everything is
  // shown back before anything is sent, because a silently mis-parsed quantity is a
  // wrong answer that looks right.
  // ---------------------------------------------------------------------------
  const HEADER_WORDS = /^(ticker|symbol|quantity|qty|shares|units|price|value|amount|market value)$/i;

  function splitLine(line) {
    const delimiter = line.includes("\t") ? "\t" : line.includes(";") ? ";" : ",";
    return line.split(delimiter).map((cell) => cell.trim().replace(/^"(.*)"$/, "$1").trim());
  }

  function parseNumber(text) {
    if (text === undefined || text === null) return null;
    // Strip currency symbols, spaces and thousands separators; keep sign and decimal point.
    const cleaned = String(text).replace(/[^\d.,\-]/g, "").replace(/,(?=\d{3}\b)/g, "");
    const value = Number(cleaned.replace(/,/g, "."));
    return Number.isFinite(value) ? value : null;
  }

  function parseHoldings(text) {
    const lines = String(text).split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
    const rows = [];
    lines.forEach((line, index) => {
      const cells = splitLine(line);
      if (!cells.length) return;
      // A header row is optional; detect it rather than requiring it.
      if (index === 0 && cells.filter((c) => HEADER_WORDS.test(c)).length >= 2) return;
      const ticker = (cells[0] || "").toUpperCase().replace(/\s+/g, "");
      const quantity = parseNumber(cells[1]);
      const price = cells.length > 2 ? parseNumber(cells[2]) : null;
      const row = { ticker, quantity, line };
      if (isNum(price) && price > 0) row.price = price;
      if (!ticker) row.problem = "No ticker";
      else if (!/^[A-Z0-9.\-]{1,15}$/.test(ticker)) row.problem = "Ticker looks wrong";
      else if (!isNum(quantity)) row.problem = "No quantity";
      else if (quantity < 0) row.problem = "Negative quantity";
      rows.push(row);
    });
    return rows;
  }

  function renderPreview() {
    const rows = state.rows;
    const good = rows.filter((r) => !r.problem);
    const bad = rows.filter((r) => r.problem);
    const overLimit = good.length > state.limits.max_rows;

    $("parsed").textContent = rows.length
      ? `${good.length} holding${good.length === 1 ? "" : "s"} read${bad.length ? `, ${bad.length} line${bad.length === 1 ? "" : "s"} to fix` : ""}`
      : "";
    $("calc").disabled = !good.length || !!bad.length || overLimit || !state.selected || !canCallTools;

    if (!rows.length) { $("preview").innerHTML = ""; contextChanged(); return; }
    const source = state.prefilled
      ? `<div class="note">These came from the assistant - check them against your account before calculating. Edit the box above to change anything.</div>` : "";
    const limitNote = overLimit
      ? `<div class="banner">${good.length} rows is over the ${state.limits.max_rows}-row limit. Trim the list and try again.</div>` : "";
    const fixNote = bad.length
      ? `<div class="banner">Fix or remove the highlighted line${bad.length === 1 ? "" : "s"} before calculating.</div>` : "";
    $("preview").innerHTML = source + limitNote + fixNote + `<div class="tablebox"><table>
        <thead><tr><th>Ticker</th><th class="num">Quantity</th><th class="num">Price</th><th></th></tr></thead>
        <tbody>${rows.map((r) => `<tr class="${r.problem ? "bad" : ""}">
          <td><strong>${esc(r.ticker || "—")}</strong></td>
          <td class="num">${isNum(r.quantity) ? esc(num(r.quantity, 4)) : "—"}</td>
          <td class="num">${isNum(r.price) ? esc(num(r.price)) : "—"}</td>
          <td class="meta">${esc(r.problem || "")}</td></tr>`).join("")}</tbody>
      </table></div>`;
    contextChanged();
  }

  // ---------------------------------------------------------------------------
  // Calculate
  // ---------------------------------------------------------------------------
  async function calculate() {
    const holdings = state.rows.filter((r) => !r.problem)
      .map((r) => (isNum(r.price) ? { ticker: r.ticker, quantity: r.quantity, price: r.price } : { ticker: r.ticker, quantity: r.quantity }));
    if (!holdings.length || !state.selected) return;
    $("calc").disabled = true;
    $("result").innerHTML = `<div class="empty">Calculating…</div>`;
    try {
      state.result = await callTool("rebalance_portfolio", { portfolio_code: state.selected, holdings });
      renderResult();
    } catch (err) {
      state.result = null;
      $("result").innerHTML = `<h2>Alignment</h2><div class="error">${esc(err.message)}</div>`;
    } finally {
      $("calc").disabled = false;
      renderActions();
      contextChanged();
    }
  }

  function renderResult() {
    const r = state.result;
    if (!r) { $("result").innerHTML = ""; return; }
    const orders = r.orders || [];
    const buys = orders.filter((o) => String(o.action).toUpperCase() === "BUY");
    const sells = orders.filter((o) => String(o.action).toUpperCase() === "SELL");
    const cards = [
      ["Changes", String(r.total_orders ?? orders.length)],
      ["To buy", String(buys.length)],
      ["To sell", String(sells.length)],
    ];
    if (isNum(r.portfolio_value)) cards.push(["Holdings value", num(r.portfolio_value, 0)]);

    const body = orders.length ? orders.map((o) => {
      const action = String(o.action || "").toUpperCase();
      return `<tr>
        <td><strong>${esc(o.ticker)}</strong></td>
        <td class="${action === "BUY" ? "buy" : "sell"}">${esc(action)}</td>
        <td class="num">${isNum(o.quantity) ? esc(num(o.quantity, 4)) : "—"}</td>
        <td class="num">${isNum(o.estimated_value) ? esc(num(o.estimated_value, 0)) : "—"}</td>
        <td class="num">${isNum(o.current_weight_pct) ? esc(num(o.current_weight_pct)) + "%" : "—"}</td>
        <td class="num">${isNum(o.target_weight_pct) ? esc(num(o.target_weight_pct)) + "%" : "—"}</td>
        <td class="num">${isNum(o.change_pct) ? esc(num(o.change_pct)) + " pp" : "—"}</td>
      </tr>`;
    }).join("") : `<tr><td colspan="7" class="empty">These holdings already match the model.</td></tr>`;

    $("result").innerHTML = `<h2><span class="step">3</span>Alignment</h2>`
      + `<div class="meta">Difference between the holdings above and ${esc(nameOf(state.selected))}${r.snapshot_date ? `, as of ${esc(String(r.snapshot_date).slice(0, 10))}` : ""}.</div>`
      + `<div class="cards">${cards.map(([k, v]) => `<div class="card"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`).join("")}</div>`
      + `<div class="tablebox"><table><thead><tr><th>Ticker</th><th>Action</th><th class="num">Quantity</th><th class="num">Est. value</th><th class="num">Current</th><th class="num">Target</th><th class="num">Change</th></tr></thead><tbody>${body}</tbody></table></div>`
      + `<div class="row" style="margin-top:10px">`
      + (r.csv_raw ? `<button id="export" class="action" type="button">${hostCaps.downloadFile ? "Download CSV" : "Show CSV"}</button>` : "")
      + `</div>`
      + `<div id="csvbox"></div>`
      + `<div class="note">Model alignment arithmetic only: the difference between the holdings entered above and the published target weights. It is not advice or a recommendation to trade, no suitability assessment has been performed, and nothing here places an order. Estimated values use the prices supplied above where given.</div>`;

    const exportBtn = $("export");
    if (exportBtn) exportBtn.addEventListener("click", () => exportCsv(r.csv_raw));
  }

  // A sandboxed page cannot start a download itself; `ui/download-file` is the host-mediated
  // route, and the host confirms it. ChatGPT does not advertise downloadFile today, so the
  // fallback shows the CSV to copy rather than offering a button that does nothing.
  function exportCsv(csv) {
    if (!hostCaps.downloadFile) {
      $("csvbox").innerHTML = `<div class="note">Copy this into a spreadsheet:</div><textarea readonly rows="8"></textarea>`;
      const box = $("csvbox").querySelector("textarea");
      box.value = csv;
      box.focus();
      box.select();
      return;
    }
    request("ui/download-file", { contents: [{
      type: "resource",
      resource: { uri: `alignment-${String(state.selected || "portfolio").toLowerCase()}.csv`, mimeType: "text/csv", text: csv },
    }] })
      .then((res) => toast(res && res.isError ? "Download declined" : "Download started"))
      .catch((err) => { toast("Couldn't download"); logToHost("warning", `ui/download-file failed: ${err.message}`); });
  }

  // ---------------------------------------------------------------------------
  // Model context and actions
  // ---------------------------------------------------------------------------
  const nameOf = (code) => { const p = state.portfolios.find((x) => x.code === code); return (p && p.product_name) || code || "—"; };

  function askText() {
    if (state.result) {
      return `Using the Rebalance Studio, explain the alignment between my holdings and the ${nameOf(state.selected)} model portfolio: which positions are over- and under-weight and what the arithmetic suggests changing. Do not treat it as advice.`;
    }
    const good = state.rows.filter((r) => !r.problem).length;
    return good ? `Using the Rebalance Studio, I have entered ${good} holdings to compare with ${nameOf(state.selected)}.` : null;
  }

  function renderActions() {
    const ask = $("ask");
    ask.hidden = !hostCaps.message || !askText();
    const modes = hostCtx.availableDisplayModes || [];
    const expand = $("expand");
    expand.hidden = !modes.includes("fullscreen");
    expand.textContent = hostCtx.displayMode === "fullscreen" ? "Exit full screen" : "Expand";
  }

  $("ask").addEventListener("click", () => {
    const text = askText();
    if (!text) return;
    request("ui/message", { role: "user", content: { type: "text", text } })
      .then(() => toast("Sent to the conversation"))
      .catch((err) => { toast("Couldn't send"); logToHost("error", `ui/message failed: ${err.message}`); });
  });

  $("expand").addEventListener("click", () => {
    const mode = hostCtx.displayMode === "fullscreen" ? "inline" : "fullscreen";
    request("ui/request-display-mode", { mode })
      .then((res) => { hostCtx.displayMode = (res && res.mode) || mode; renderActions(); })
      .catch((err) => logToHost("warning", `request-display-mode failed: ${err.message}`));
  });

  // The model is told the shape of the work, never the holdings themselves: those are the
  // user's own positions, and they are already in the conversation if the user wants them
  // there.
  let contextTimer = null;
  function contextChanged() {
    if (!hostCaps.updateModelContext) return;
    clearTimeout(contextTimer);
    contextTimer = setTimeout(() => {
      const good = state.rows.filter((r) => !r.problem).length;
      const bad = state.rows.length - good;
      const r = state.result;
      const text = `The user has the Rebalance Studio open, aligning to ${nameOf(state.selected)} (${state.selected}). `
        + `${good} holdings entered${bad ? `, ${bad} lines still to fix` : ""}. `
        + (r ? `The calculation returned ${r.total_orders ?? (r.orders || []).length} changes.` : "No calculation has been run yet.");
      request("ui/update-model-context", {
        content: [{ type: "text", text }],
        structuredContent: {
          panel: "rebalance", portfolio: state.selected, holdings_entered: good, lines_to_fix: bad,
          calculated: !!r, changes: r ? (r.total_orders ?? (r.orders || []).length) : null,
        },
      }).catch((err) => logToHost("warning", `update-model-context failed: ${err.message}`));
    }, 600);
  }

  // ---------------------------------------------------------------------------
  // Render the picker
  // ---------------------------------------------------------------------------
  function renderPicker() {
    const eligible = state.portfolios.filter((p) => p.access === "subscribed");
    const select = $("portfolio");
    select.innerHTML = eligible.map((p) => `<option value="${esc(p.code)}"${p.code === state.selected ? " selected" : ""}>${esc(p.product_name || p.code)}</option>`).join("");
    select.disabled = eligible.length < 2;

    // Alignment needs a subscription. Saying so here beats a rejected calculation.
    const gate = $("gate");
    if (!eligible.length) {
      gate.hidden = false;
      gate.textContent = "Aligning holdings to a model needs a subscription to that model. The portfolios on this connection are all on the public delayed book, so there is nothing to align to yet.";
      $("holdings").disabled = true;
    } else {
      gate.hidden = true;
      $("holdings").disabled = false;
    }
  }

  function showError(message) {
    $("result").innerHTML = `<div class="error">${esc(message)}</div>`;
    logToHost("error", message);
  }

  let gotToolResult = false;
  function onToolResult(params) {
    try {
      const data = parseResult(params && params.result ? params.result : params);
      gotToolResult = true;
      state.portfolios = data.portfolios || [];
      state.selected = data.selected || null;
      if (data.limits) state.limits = data.limits;
      if (data.disclaimer) $("disclaimer").textContent = data.disclaimer;
      // Holdings the assistant read from the user's brokerage connector arrive here. They
      // are shown for checking rather than calculated straight away: a position the other
      // connector reports differently is the user's to correct, not ours to assume.
      if (data.holdings_text) {
        $("holdings").value = data.holdings_text;
        state.rows = parseHoldings(data.holdings_text);
        state.prefilled = true;
      }
      renderPicker();
      renderPreview();
      renderActions();
    } catch (err) {
      showError(err.message);
    }
  }

  $("portfolio").addEventListener("change", (e) => { state.selected = e.target.value; state.result = null; $("result").innerHTML = ""; renderPreview(); renderActions(); });
  // Once the user edits, the rows are theirs - the "these came from the assistant" note goes.
  $("holdings").addEventListener("input", () => { state.prefilled = false; state.rows = parseHoldings($("holdings").value); state.result = null; $("result").innerHTML = ""; renderPreview(); renderActions(); });
  $("clear").addEventListener("click", () => { $("holdings").value = ""; state.prefilled = false; state.rows = []; state.result = null; $("result").innerHTML = ""; renderPreview(); renderActions(); });
  $("calc").addEventListener("click", calculate);

  // ---------------------------------------------------------------------------
  // Size and handshake
  // ---------------------------------------------------------------------------
  const wrap = document.querySelector(".wrap");
  let reported = { width: 0, height: 0 };
  function reportSize(force) {
    const box = wrap.getBoundingClientRect();
    const size = { width: Math.ceil(box.width), height: Math.ceil(box.height) };
    if (!force && Math.abs(size.height - reported.height) < 2 && Math.abs(size.width - reported.width) < 2) return;
    reported = size;
    notify("ui/notifications/size-changed", size);
  }
  new ResizeObserver(() => reportSize(false)).observe(wrap);

  $("disclaimer").textContent = "Informational and educational purposes only. Not investment, legal, or tax advice, and not a recommendation or solicitation. No suitability assessment has been performed.";

  async function bootstrap() {
    if (gotToolResult) return;
    if (!canCallTools) { showError("No portfolio list was received. Ask the assistant to open the Rebalance Studio again."); return; }
    try {
      const listing = await callTool("list_portfolios", {});
      if (gotToolResult) return;
      const portfolios = listing.portfolios || [];
      const first = portfolios.find((p) => p.access === "subscribed");
      onToolResult({ content: [{ type: "text", text: JSON.stringify({
        portfolios, selected: first ? first.code : null, disclaimer: listing.disclaimer,
      }) }] });
    } catch (err) {
      showError(err.message);
    }
  }

  request("ui/initialize", {
    protocolVersion: "2025-06-18",
    appInfo: { name: "financial-portfolios-ai-rebalance", version: "__APP_VERSION__" },
    appCapabilities: { availableDisplayModes: ["inline", "fullscreen"] },
  }).then((init) => {
    hostCaps = (init && init.hostCapabilities) || {};
    applyContext(init && init.hostContext);
    canCallTools = !!hostCaps.serverTools;
    notify("ui/notifications/initialized", {});
    reportSize(true);
    renderActions();
    renderPreview();
    setTimeout(bootstrap, 2500);
  }).catch(() => {
    notify("ui/notifications/initialized", {});
  });
})();
</script>
</body>
</html>
