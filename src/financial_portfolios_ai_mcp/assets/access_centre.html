<!-- Access & Connection: what this account can see, what the delayed book omits, how it is
     signed in. Self-contained (inline script and styles, no network) because the host's
     default CSP for an MCP App allows nothing else. -->
<meta charset="utf-8">
<title>Access &amp; Connection</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: var(--color-background-primary, #ffffff); --panel: var(--color-background-secondary, #f5f6fa);
    --line: var(--color-border-primary, #e2e4ee); --text: var(--color-text-primary, #16182b);
    --muted: var(--color-text-secondary, #646a85);
    --accent: #1f9aa6; --accent-soft: rgba(31,154,166,.12); --violet: #6f57e0;
    --warn-bg: #fdf3e2; --warn-text: #8a5a12; --warn-line: #efd7ae;
  }
  :root[data-theme="dark"] {
    --bg: var(--color-background-primary, #111322); --panel: var(--color-background-secondary, #181b2e);
    --line: var(--color-border-primary, #2a2e47); --text: var(--color-text-primary, #e9ebf5);
    --muted: var(--color-text-secondary, #9aa0b8);
    --accent: #3ee6f0; --accent-soft: rgba(62,230,240,.12); --violet: #9b85ff;
    --warn-bg: #2b2111; --warn-text: #f5c77e; --warn-line: #5a4320;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 var(--font-sans, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif); }
  .wrap { padding: 16px; }
  header { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
  h1 { font-size: 15px; margin: 0; font-weight: 650; letter-spacing: .2px; }
  h2 { font-size: 13px; margin: 20px 0 8px; font-weight: 650; }
  .actions { display: flex; gap: 6px; margin-left: auto; }
  .action { font: inherit; font-size: 12.5px; color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 11px; cursor: pointer; white-space: nowrap; }
  @media (hover: hover) { .action:hover { border-color: var(--accent); } }
  .action:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .badge.live { background: var(--accent-soft); color: var(--accent); }
  .badge.delayed { background: var(--warn-bg); color: var(--warn-text); border: 1px solid var(--warn-line); }
  .badge.off { background: var(--warn-bg); color: var(--warn-text); border: 1px solid var(--warn-line); }
  .meta { color: var(--muted); font-size: 12px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 8px; margin-top: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; }
  .card .k { color: var(--muted); font-size: 11.5px; }
  .card .v { font-size: 18px; font-weight: 650; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 13px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; }
  .list { display: grid; gap: 9px; }
  .item { border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; }
  .item .title { font-weight: 650; }
  .code { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .desc { color: var(--muted); font-size: 12.5px; margin-top: 5px; }
  .hides { margin: 8px 0 0; padding-left: 18px; color: var(--muted); font-size: 12.5px; }
  .hides li { margin: 2px 0; }
  .banner { margin-top: 12px; padding: 9px 12px; border-radius: 8px; font-size: 12.5px;
    background: var(--warn-bg); color: var(--warn-text); border: 1px solid var(--warn-line); }
  .toast { position: fixed; right: 12px; bottom: 12px; font-size: 12px; color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; box-shadow: 0 2px 8px rgba(0,0,0,.12); z-index: 10; }
  .toast:empty { display: none; }
  .empty, .error { padding: 16px; text-align: center; color: var(--muted); }
  .error { color: #d4483b; }
  footer { margin-top: 18px; padding-top: 10px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11.5px; }
  /* Touch hosts: chatgpt mobile reports hover false, touch true. */
  @media (pointer: coarse) { .action { min-height: 44px; padding: 11px 14px; } }
  html[data-touch="true"] .action { min-height: 44px; padding: 11px 14px; }
</style>
<div class="wrap">
  <header>
    <h1>Access &amp; Connection</h1>
    <span id="conn-badge"></span>
    <div class="actions">
      <span id="toast" class="toast" role="status" aria-live="polite"></span>
      <button id="expand" class="action" type="button" hidden>Expand</button>
    </div>
  </header>

  <div id="cards" class="cards"></div>
  <div id="body"><div class="empty">Loading your access…</div></div>
  <footer id="disclaimer"></footer>
</div>

<script>
(() => {
  "use strict";

  // ---------------------------------------------------------------------------
  // Host bridge: MCP Apps JSON-RPC over postMessage (ext-apps spec).
  // ---------------------------------------------------------------------------
  let nextId = 1;
  const pending = new Map();
  let canCallTools = false;
  let hostCaps = {};
  const hostCtx = {};

  function send(message) { window.parent.postMessage(message, "*"); }
  function request(method, params) {
    const id = nextId++;
    send({ jsonrpc: "2.0", id, method, params });
    return new Promise((resolve, reject) => pending.set(id, { resolve, reject }));
  }
  function notify(method, params) { send({ jsonrpc: "2.0", method, params }); }

  window.addEventListener("message", (event) => {
    if (event.source !== window.parent) return;
    const m = event.data;
    if (!m || m.jsonrpc !== "2.0") return;
    if (m.id !== undefined && pending.has(m.id) && !m.method) {
      const { resolve, reject } = pending.get(m.id);
      pending.delete(m.id);
      m.error ? reject(new Error(m.error.message || "Host error")) : resolve(m.result);
      return;
    }
    switch (m.method) {
      case "ui/notifications/tool-result": onToolResult(m.params); break;
      case "ui/notifications/host-context-changed": applyContext(m.params); break;
      default:
        if (m.id !== undefined && m.method) send({ jsonrpc: "2.0", id: m.id, result: {} });
    }
  });

  function applyContext(ctx) {
    if (!ctx) return;
    Object.assign(hostCtx, ctx);
    if (ctx.theme === "dark" || ctx.theme === "light") document.documentElement.dataset.theme = ctx.theme;
    const device = ctx.deviceCapabilities;
    if (device && typeof device === "object" && typeof device.touch === "boolean") {
      document.documentElement.dataset.touch = String(device.touch);
    }
    const vars = ctx.styles && ctx.styles.variables;
    if (vars && typeof vars === "object") {
      Object.entries(vars).forEach(([name, value]) => {
        if (/^--[a-z0-9-]{1,64}$/.test(name) && typeof value === "string" && value.length < 200 && !/url\(|expression\(/i.test(value)) {
          document.documentElement.style.setProperty(name, value);
        }
      });
    }
    renderActions();
  }

  function logToHost(level, message) {
    if (hostCaps.logging) notify("notifications/message", { level, message: String(message).slice(0, 500) });
  }

  // Our tools return a JSON string, sent both as a text block and wrapped as
  // structuredContent {"result": "<the same JSON>"}. Text first, then unwrap.
  function parseResult(result) {
    if (!result) throw new Error("No result");
    let data = null;
    const block = (result.content || []).find((c) => c.type === "text" && typeof c.text === "string");
    if (block) { try { data = JSON.parse(block.text); } catch (_) { data = null; } }
    if (data === null && result.structuredContent) {
      const sc = result.structuredContent;
      data = typeof sc.result === "string" ? JSON.parse(sc.result) : sc;
    }
    if (data === null) throw new Error(block ? block.text : "Empty result");
    if (result.isError || data.error) throw new Error(data.message || data.error || "Request failed");
    return data;
  }

  async function callTool(name, args) {
    if (!canCallTools) throw new Error("This app can't fetch more data in this client.");
    try {
      return parseResult(await request("tools/call", { name, arguments: args }));
    } catch (err) {
      logToHost("error", `${name} failed: ${err.message}`);
      throw err;
    }
  }

  // ---------------------------------------------------------------------------
  // Render
  // ---------------------------------------------------------------------------
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  let state = null;

  const AUTH_LABEL = { oauth: "Signed in with OAuth", api_token: "Signed in with a personal API token", none: "Not signed in" };

  function toast(message) {
    $("toast").textContent = message;
    setTimeout(() => { if ($("toast").textContent === message) $("toast").textContent = ""; }, 3000);
  }

  function openLink(url) {
    if (!hostCaps.openLinks) { toast("This client can't open links"); return; }
    request("ui/open-link", { url })
      .then((r) => { if (r && r.isError) toast("The client blocked that link"); })
      .catch((err) => { toast("Couldn't open the link"); logToHost("warning", `ui/open-link failed: ${err.message}`); });
  }

  function ask(text) {
    if (!hostCaps.message) { toast("This client can't send messages"); return; }
    request("ui/message", { role: "user", content: { type: "text", text } })
      .then(() => toast("Sent to the conversation"))
      .catch((err) => { toast("Couldn't send"); logToHost("error", `ui/message failed: ${err.message}`); });
  }

  function renderActions() {
    const modes = hostCtx.availableDisplayModes || [];
    const expand = $("expand");
    expand.hidden = !modes.includes("fullscreen");
    expand.textContent = hostCtx.displayMode === "fullscreen" ? "Exit full screen" : "Expand";
  }

  $("expand").addEventListener("click", () => {
    const mode = hostCtx.displayMode === "fullscreen" ? "inline" : "fullscreen";
    request("ui/request-display-mode", { mode })
      .then((r) => { hostCtx.displayMode = (r && r.mode) || mode; renderActions(); })
      .catch((err) => logToHost("warning", `request-display-mode failed: ${err.message}`));
  });

  // Buttons are wired by data-attribute rather than inline handlers: the host's CSP
  // disallows inline event handlers in an app page.
  function wire(root) {
    root.querySelectorAll("[data-link]").forEach((el) => el.addEventListener("click", () => openLink(el.dataset.link)));
    root.querySelectorAll("[data-ask]").forEach((el) => el.addEventListener("click", () => ask(el.dataset.ask)));
  }

  function render() {
    const s = state;
    if (!s) return;
    const conn = s.connection || {};
    const links = s.links || {};
    const portfolios = s.portfolios || [];
    const delayed = portfolios.filter((p) => p.delayed);
    const live = portfolios.filter((p) => !p.delayed);

    $("conn-badge").innerHTML = conn.connected
      ? `<span class="badge live">Connected</span>`
      : `<span class="badge off">Not signed in</span>`;

    $("cards").innerHTML = [
      ["Portfolios", String(portfolios.length)],
      ["Live books", String(live.length)],
      ["Delayed books", String(delayed.length)],
    ].map(([k, v]) => `<div class="card"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`).join("");

    const linkBtn = (label, url) => hostCaps.openLinks
      ? `<button class="action" type="button" data-link="${esc(url)}">${esc(label)}</button>`
      : `<span class="meta">${esc(label)}: ${esc(url)}</span>`;

    const connection = `<h2>Connection</h2><div class="panel">
        <div class="row"><strong>${esc(AUTH_LABEL[conn.authentication] || "Connection")}</strong></div>
        <div class="desc">${esc(conn.detail || "")}</div>
        <div class="row" style="margin-top:10px">
          ${linkBtn("Open the portal", links.portal || "")}
          ${conn.authentication === "api_token" ? linkBtn("Manage API tokens", links.api_tokens || "") : ""}
        </div>
        <div class="desc" style="margin-top:8px">Never type or paste an API token into the chat. If the connection stops working, reconnect the connector and sign in.</div>
      </div>`;

    const items = portfolios.length ? portfolios.map((p) => {
      const badge = p.delayed
        ? `<span class="badge delayed">Delayed ~45 days</span>`
        : `<span class="badge live">Live book</span>`;
      const bits = [p.risk_level ? `Risk: ${p.risk_level}` : "", p.theme ? `Theme: ${p.theme}` : ""].filter(Boolean).join(" · ");
      return `<div class="item">
          <div class="row"><span class="title">${esc(p.product_name || p.code)}</span>${badge}<span class="code">${esc(p.code)}</span></div>
          ${bits ? `<div class="desc">${esc(bits)}</div>` : ""}
          ${p.product_description ? `<div class="desc">${esc(p.product_description)}</div>` : ""}
          <div class="row" style="margin-top:9px">
            ${hostCaps.message ? `<button class="action" type="button" data-ask="Open the Portfolio Explorer on ${esc(p.code)}.">Explore holdings</button>` : ""}
            ${p.delayed ? linkBtn("Subscribe for the live book", links.pricing || "") : ""}
          </div>
        </div>`;
    }).join("") : `<div class="empty">No portfolios are visible to this connection.</div>`;

    const delayedNote = delayed.length ? `<h2>What a delayed book leaves out</h2><div class="panel">
        <div class="desc">${s.plan === "free_delayed" ? "You're on free access: every portfolio's public book, free of charge, about 45 days behind the live allocation." : `${delayed.length} of your ${portfolios.length} portfolios are published on the public book, about 45 days behind the live allocation.`} That book is the model as it stood then, not the current one, and these figures are withheld from it:</div>
        <ul class="hides">${(s.delayed_hides || []).map((h) => `<li>${esc(h)}</li>`).join("")}</ul>
        <div class="row" style="margin-top:10px">${linkBtn("See subscription options", links.pricing || "")}</div>
      </div>` : "";

    const body = $("body");
    body.innerHTML = connection + `<h2>Your portfolios</h2><div class="list">${items}</div>` + delayedNote;
    wire(body);
    contextChanged();
  }

  // Tell the model what access this account has, so it stops guessing which portfolios are
  // live and stops re-explaining the delay every turn.
  let contextTimer = null;
  function contextChanged() {
    if (!hostCaps.updateModelContext || !state) return;
    clearTimeout(contextTimer);
    contextTimer = setTimeout(() => {
      const portfolios = state.portfolios || [];
      const live = portfolios.filter((p) => !p.delayed).map((p) => p.code);
      const delayed = portfolios.filter((p) => p.delayed).map((p) => p.code);
      const text = `The user has the Access & Connection panel open. `
        + `${(state.connection || {}).connected ? `They are connected (${(state.connection || {}).authentication}).` : "They are not signed in."} `
        + `${live.length ? `Live books: ${live.join(", ")}. ` : ""}`
        + `${delayed.length ? `Delayed about 45 days: ${delayed.join(", ")} - for these, effective N, equity exposure, cash and the expected-return and volatility figures are null.` : ""}`;
      request("ui/update-model-context", {
        content: [{ type: "text", text }],
        structuredContent: { panel: "access", connection: state.connection || null, live, delayed },
      }).catch((err) => logToHost("warning", `update-model-context failed: ${err.message}`));
    }, 600);
  }

  function showError(message) {
    $("body").innerHTML = `<div class="error">${esc(message)}</div>`;
    logToHost("error", message);
  }

  let gotToolResult = false;
  function onToolResult(params) {
    try {
      const data = parseResult(params && params.result ? params.result : params);
      gotToolResult = true;
      state = data;
      if (data.disclaimer) $("disclaimer").textContent = data.disclaimer;
      render();
    } catch (err) {
      showError(err.message);
    }
  }

  // ---------------------------------------------------------------------------
  // Size and handshake
  // ---------------------------------------------------------------------------
  const wrap = document.querySelector(".wrap");
  let reported = { width: 0, height: 0 };
  function reportSize(force) {
    const box = wrap.getBoundingClientRect();
    const size = { width: Math.ceil(box.width), height: Math.ceil(box.height) };
    if (!force && Math.abs(size.height - reported.height) < 2 && Math.abs(size.width - reported.width) < 2) return;
    reported = size;
    notify("ui/notifications/size-changed", size);
  }
  new ResizeObserver(() => reportSize(false)).observe(wrap);

  $("disclaimer").textContent = "Informational and educational purposes only. Not investment, legal, or tax advice, and not a recommendation or solicitation. No suitability assessment has been performed.";

  // If the host never delivers the tool result, fetch what we can rather than sitting on
  // an empty page. list_portfolios is the same read the panel is built from.
  async function bootstrap() {
    if (gotToolResult) return;
    if (!canCallTools) {
      showError("No access data was received. Ask the assistant to open Access & Connection again.");
      return;
    }
    try {
      const listing = await callTool("list_portfolios", {});
      if (gotToolResult) return;
      onToolResult({ content: [{ type: "text", text: JSON.stringify({
        connection: { connected: true, authentication: "unknown", detail: "Connected." },
        portfolios: listing.portfolios || [],
        links: {}, delayed_hides: [], disclaimer: listing.disclaimer,
      }) }] });
    } catch (err) {
      showError(err.message);
    }
  }

  request("ui/initialize", {
    protocolVersion: "2025-06-18",
    appInfo: { name: "financial-portfolios-ai-access", version: "__APP_VERSION__" },
    appCapabilities: { availableDisplayModes: ["inline", "fullscreen"] },
  }).then((init) => {
    hostCaps = (init && init.hostCapabilities) || {};
    applyContext(init && init.hostContext);
    canCallTools = !!hostCaps.serverTools;
    notify("ui/notifications/initialized", {});
    reportSize(true);
    renderActions();
    if (state) render();
    setTimeout(bootstrap, 2500);
  }).catch(() => {
    notify("ui/notifications/initialized", {});
  });
})();
</script>
