<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Research Reader</title>
<style>
  :root {
    --bg: var(--color-background-primary, #ffffff); --panel: var(--color-background-secondary, #f6f7fb);
    --line: var(--color-border-primary, #e3e6ef); --text: var(--color-text-primary, #16182b);
    --muted: var(--color-text-secondary, #5d6275);
    --accent: #0e9fb0; --accent-soft: rgba(14,159,176,.12); --violet: #6a4bd6;
    --warn-bg: #fff5e6; --warn-text: #8a4b00; --warn-line: #f3c98b;
  }
  :root[data-theme="dark"] {
    --bg: var(--color-background-primary, #111322); --panel: var(--color-background-secondary, #181b2e);
    --line: var(--color-border-primary, #2a2e47); --text: var(--color-text-primary, #e9ebf5);
    --muted: var(--color-text-secondary, #9aa0b8);
    --accent: #3ee6f0; --accent-soft: rgba(62,230,240,.12); --violet: #9b85ff;
    --warn-bg: #2b2111; --warn-text: #f5c77e; --warn-line: #5a4320;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 var(--font-sans, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif); }
  .wrap { padding: 16px; }
  header { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
  h1 { font-size: 15px; margin: 0; font-weight: 650; letter-spacing: .2px; }
  .actions { display: flex; gap: 6px; margin-left: auto; }
  .action { font: inherit; font-size: 12.5px; color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 11px; cursor: pointer; white-space: nowrap; }
  .action[disabled] { opacity: .5; cursor: default; }
  @media (hover: hover) { .action:not([disabled]):hover { border-color: var(--accent); } }
  .action:focus-visible, input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  input { font: inherit; color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; min-width: 190px; }
  .toolbar { display: flex; gap: 8px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
  .chip { font: inherit; font-size: 12.5px; color: var(--muted); background: var(--panel); border: 1px solid var(--line);
    border-radius: 999px; padding: 5px 11px; cursor: pointer; }
  .chip[aria-pressed="true"] { color: var(--text); border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
  .badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .badge.held { background: var(--accent-soft); color: var(--accent); }
  .badge.locked { background: var(--warn-bg); color: var(--warn-text); border: 1px solid var(--warn-line); }
  .meta { color: var(--muted); font-size: 12px; }
  .note { color: var(--muted); font-size: 11.5px; margin-top: 8px; }
  .list { display: grid; gap: 9px; margin-top: 12px; }
  .item { border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; cursor: pointer; background: none;
    text-align: left; font: inherit; color: var(--text); width: 100%; display: block; }
  .item:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  @media (hover: hover) { .item:hover { border-color: var(--accent); } }
  .item .title { font-weight: 650; }
  .item .row { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; margin-bottom: 3px; }
  .excerpt { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
  article h3 { font-size: 14px; margin: 14px 0 6px; }
  article p { margin: 8px 0; }
  article ul { margin: 8px 0; padding-left: 20px; }
  article li { margin: 3px 0; }
  .banner { margin-top: 12px; padding: 9px 12px; border-radius: 8px; font-size: 12.5px;
    background: var(--warn-bg); color: var(--warn-text); border: 1px solid var(--warn-line); }
  .empty, .error { padding: 18px; text-align: center; color: var(--muted); }
  .error { color: #c0392b; }
  .toast { position: fixed; right: 12px; bottom: 12px; font-size: 12px; color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; box-shadow: 0 2px 8px rgba(0,0,0,.12); z-index: 10; }
  .toast:empty { display: none; }
  footer { margin-top: 18px; padding-top: 10px; border-top: 1px solid var(--line); color: var(--muted); font-size: 11.5px; }
  @media (pointer: coarse) { .action, .chip { min-height: 44px; padding: 11px 14px; } input { min-height: 44px; } }
  html[data-touch="true"] .action, html[data-touch="true"] .chip { min-height: 44px; padding: 11px 14px; }
  html[data-touch="true"] input { min-height: 44px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Research Reader</h1>
    <div class="actions">
      <span id="toast" class="toast" role="status" aria-live="polite"></span>
      <button id="back" class="action" type="button" hidden>All posts</button>
      <button id="ask" class="action" type="button" hidden>Ask about this</button>
      <button id="expand" class="action" type="button" hidden>Expand</button>
    </div>
  </header>

  <div id="browse">
    <div class="toolbar">
      <input id="search" type="search" placeholder="Search research" aria-label="Search research">
      <button id="held" class="chip" type="button" aria-pressed="false">Mentions my holdings</button>
      <span id="count" class="meta"></span>
    </div>
    <div id="list" class="list"><div class="empty">Loading research…</div></div>
  </div>

  <div id="post" hidden></div>
  <footer id="disclaimer"></footer>
</div>

<script>
(() => {
  "use strict";

  // ---------------------------------------------------------------------------
  // Host bridge: MCP Apps JSON-RPC over postMessage (ext-apps spec).
  // ---------------------------------------------------------------------------
  let nextId = 1;
  const pending = new Map();
  let canCallTools = false;
  let hostCaps = {};
  const hostCtx = {};

  function send(message) { window.parent.postMessage(message, "*"); }
  function request(method, params) {
    const id = nextId++;
    send({ jsonrpc: "2.0", id, method, params });
    return new Promise((resolve, reject) => pending.set(id, { resolve, reject }));
  }
  function notify(method, params) { send({ jsonrpc: "2.0", method, params }); }

  window.addEventListener("message", (event) => {
    if (event.source !== window.parent) return;
    const m = event.data;
    if (!m || m.jsonrpc !== "2.0") return;
    if (m.id !== undefined && pending.has(m.id) && !m.method) {
      const { resolve, reject } = pending.get(m.id);
      pending.delete(m.id);
      m.error ? reject(new Error(m.error.message || "Host error")) : resolve(m.result);
      return;
    }
    switch (m.method) {
      case "ui/notifications/tool-result": onToolResult(m.params); break;
      case "ui/notifications/host-context-changed": applyContext(m.params); break;
      default:
        if (m.id !== undefined && m.method) send({ jsonrpc: "2.0", id: m.id, result: {} });
    }
  });

  function applyContext(ctx) {
    if (!ctx) return;
    Object.assign(hostCtx, ctx);
    if (ctx.theme === "dark" || ctx.theme === "light") document.documentElement.dataset.theme = ctx.theme;
    const device = ctx.deviceCapabilities;
    if (device && typeof device === "object" && typeof device.touch === "boolean") {
      document.documentElement.dataset.touch = String(device.touch);
    }
    const vars = ctx.styles && ctx.styles.variables;
    if (vars && typeof vars === "object") {
      Object.entries(vars).forEach(([name, value]) => {
        if (/^--[a-z0-9-]{1,64}$/.test(name) && typeof value === "string" && value.length < 200 && !/url\(|expression\(/i.test(value)) {
          document.documentElement.style.setProperty(name, value);
        }
      });
    }
    renderActions();
  }

  function logToHost(level, message) {
    if (hostCaps.logging) notify("notifications/message", { level, message: String(message).slice(0, 500) });
  }

  function parseResult(result) {
    if (!result) throw new Error("No result");
    let data = null;
    const block = (result.content || []).find((c) => c.type === "text" && typeof c.text === "string");
    if (block) { try { data = JSON.parse(block.text); } catch (_) { data = null; } }
    if (data === null && result.structuredContent) {
      const sc = result.structuredContent;
      data = typeof sc.result === "string" ? JSON.parse(sc.result) : sc;
    }
    if (data === null) throw new Error(block ? block.text : "Empty result");
    if (result.isError || data.error) throw new Error(data.message || data.error || "Request failed");
    return data;
  }

  async function callTool(name, args) {
    if (!canCallTools) throw new Error("This app can't fetch more data in this client.");
    try {
      return parseResult(await request("tools/call", { name, arguments: args }));
    } catch (err) {
      logToHost("error", `${name} failed: ${err.message}`);
      throw err;
    }
  }

  // ---------------------------------------------------------------------------
  // State and helpers
  // ---------------------------------------------------------------------------
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const state = { posts: [], search: "", heldOnly: false, tickers: null, open: null };

  function toast(message) {
    $("toast").textContent = message;
    setTimeout(() => { if ($("toast").textContent === message) $("toast").textContent = ""; }, 3000);
  }

  const dateOf = (p) => p.published_at ? String(p.published_at).slice(0, 10) : "";

  // ---------------------------------------------------------------------------
  // Holdings cross-reference: our research against our own holdings, nothing else.
  //
  // Matching is on whole words only. A bare substring match turns "ALL" or "IT"
  // into a hit in every post, which would make the filter worse than useless.
  // ---------------------------------------------------------------------------
  async function loadTickers() {
    if (state.tickers) return state.tickers;
    const tickers = new Map();
    const listing = await callTool("list_portfolios", {});
    const codes = (listing.portfolios || []).map((p) => p.code);
    for (const code of codes) {
      try {
        const allocation = await callTool("get_portfolio_allocation", { portfolio_code: code });
        (allocation.positions || []).forEach((position) => {
          const ticker = String(position.ticker || "").toUpperCase();
          if (ticker.length < 2) return; // single letters match far too much prose
          if (!tickers.has(ticker)) tickers.set(ticker, new Set());
          tickers.get(ticker).add(code);
        });
      } catch (err) {
        logToHost("warning", `Couldn't read ${code} for the holdings filter: ${err.message}`);
      }
    }
    state.tickers = tickers;
    return tickers;
  }

  function mentionedTickers(post) {
    if (!state.tickers || !state.tickers.size) return [];
    const haystack = [post.title, post.excerpt, (post.tags || []).join(" ")].filter(Boolean).join(" ").toUpperCase();
    const found = [];
    state.tickers.forEach((_codes, ticker) => {
      const pattern = new RegExp(`(^|[^A-Z0-9])${ticker.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}([^A-Z0-9]|$)`);
      if (pattern.test(haystack)) found.push(ticker);
    });
    return found;
  }

  // ---------------------------------------------------------------------------
  // Rendering a post
  //
  // Portal content may be HTML or markdown. Either way it is parsed and only text
  // is re-emitted: the page never injects markup it received, which keeps a CMS
  // entry from becoming script in the app's frame.
  // ---------------------------------------------------------------------------
  function blocksFromHtml(text) {
    const doc = new DOMParser().parseFromString(text, "text/html");
    const blocks = [];
    doc.body.querySelectorAll("h1, h2, h3, h4, p, li, blockquote").forEach((node) => {
      const content = node.textContent.trim();
      if (!content) return;
      const tag = node.tagName.toLowerCase();
      blocks.push({ kind: tag === "li" ? "li" : tag.startsWith("h") ? "h" : "p", text: content });
    });
    return blocks;
  }

  function blocksFromMarkdown(text) {
    return String(text).split(/\n{2,}/).map((chunk) => chunk.trim()).filter(Boolean).map((chunk) => {
      if (/^#{1,4}\s/.test(chunk)) return { kind: "h", text: chunk.replace(/^#{1,4}\s*/, "") };
      if (/^[-*]\s/.test(chunk)) return { kind: "li", text: chunk.replace(/^[-*]\s*/, "") };
      return { kind: "p", text: chunk };
    });
  }

  function renderPost(post) {
    state.open = post;
    $("browse").hidden = true;
    $("post").hidden = false;
    $("back").hidden = false;

    const gated = post.is_gated && !post.content;
    const blocks = post.content
      ? (/<\/?[a-z][\s\S]*>/i.test(post.content) ? blocksFromHtml(post.content) : blocksFromMarkdown(post.content))
      : [];
    const body = gated
      ? `<div class="banner">This post is available to subscribers. Open it on the portal to read the whole thing.</div>`
      : blocks.length
        ? `<article>${blocks.map((b) => b.kind === "h" ? `<h3>${esc(b.text)}</h3>` : b.kind === "li" ? `<ul><li>${esc(b.text)}</li></ul>` : `<p>${esc(b.text)}</p>`).join("")}</article>`
        : `<div class="empty">This post has no readable body.</div>`;

    const mentions = mentionedTickers(post);
    $("post").innerHTML = `<h1 style="margin-top:14px">${esc(post.title)}</h1>`
      + `<div class="meta" style="margin-top:4px">${esc([dateOf(post), post.author].filter(Boolean).join(" · "))}</div>`
      + (mentions.length ? `<div class="note">Mentions holdings in your portfolios: ${esc(mentions.join(", "))}.</div>` : "")
      + body
      + `<div class="note">Research and commentary, informational only. Nothing here is a recommendation to buy or sell, and a stock's appearance in a post is not a view on owning it.</div>`;
    renderActions();
    contextChanged();
  }

  async function openPost(slug) {
    $("post").innerHTML = `<div class="empty">Loading…</div>`;
    $("browse").hidden = true;
    $("post").hidden = false;
    $("back").hidden = false;
    try {
      renderPost(await callTool("get_blog_post", { slug }));
    } catch (err) {
      $("post").innerHTML = `<div class="error">${esc(err.message)}</div>`;
    }
  }

  // ---------------------------------------------------------------------------
  // Rendering the list
  // ---------------------------------------------------------------------------
  function renderList() {
    const all = state.posts;
    const rows = state.heldOnly ? all.filter((p) => mentionedTickers(p).length) : all;
    $("count").textContent = all.length
      ? `${rows.length} of ${all.length} post${all.length === 1 ? "" : "s"}`
      : "";
    $("held").setAttribute("aria-pressed", String(state.heldOnly));

    if (!rows.length) {
      $("list").innerHTML = `<div class="empty">${state.heldOnly
        ? "No posts mention a ticker in your portfolios."
        : state.search ? "No research matches." : "No research has been published yet."}</div>`;
      contextChanged();
      return;
    }
    $("list").innerHTML = rows.map((p) => {
      const mentions = mentionedTickers(p);
      return `<button class="item" type="button" data-slug="${esc(p.slug)}">
        <div class="row">
          <span class="title">${esc(p.title)}</span>
          ${mentions.length ? `<span class="badge held">Holds ${esc(mentions.slice(0, 3).join(", "))}</span>` : ""}
          ${p.is_gated && p.is_accessible === false ? `<span class="badge locked">Subscribers</span>` : ""}
        </div>
        <div class="meta">${esc([dateOf(p), p.author, (p.tags || []).slice(0, 3).join(", ")].filter(Boolean).join(" · "))}</div>
        ${p.excerpt ? `<div class="excerpt">${esc(p.excerpt)}</div>` : ""}
      </button>`;
    }).join("");
    $("list").querySelectorAll("[data-slug]").forEach((el) => el.addEventListener("click", () => openPost(el.dataset.slug)));
    contextChanged();
  }

  async function runSearch() {
    const query = $("search").value.trim();
    state.search = query;
    $("list").innerHTML = `<div class="empty">Searching…</div>`;
    try {
      const listing = await callTool("list_blog_posts", query ? { search: query, page_size: 20 } : { page_size: 20 });
      state.posts = listing.items || [];
      renderList();
    } catch (err) {
      $("list").innerHTML = `<div class="error">${esc(err.message)}</div>`;
    }
  }

  // ---------------------------------------------------------------------------
  // Actions and model context
  // ---------------------------------------------------------------------------
  function askText() {
    if (state.open) return `Using the Research Reader, summarise "${state.open.title}" and what it says.`;
    if (state.heldOnly) return "Using the Research Reader, summarise the research that mentions holdings in my portfolios.";
    return state.search
      ? `Using the Research Reader, summarise what the research says about ${state.search}.`
      : "Using the Research Reader, summarise the latest research.";
  }

  function renderActions() {
    $("ask").hidden = !hostCaps.message || !state.posts.length;
    const modes = hostCtx.availableDisplayModes || [];
    const expand = $("expand");
    expand.hidden = !modes.includes("fullscreen");
    expand.textContent = hostCtx.displayMode === "fullscreen" ? "Exit full screen" : "Expand";
  }

  $("ask").addEventListener("click", () => {
    request("ui/message", { role: "user", content: { type: "text", text: askText() } })
      .then(() => toast("Sent to the conversation"))
      .catch((err) => { toast("Couldn't send"); logToHost("error", `ui/message failed: ${err.message}`); });
  });

  $("expand").addEventListener("click", () => {
    const mode = hostCtx.displayMode === "fullscreen" ? "inline" : "fullscreen";
    request("ui/request-display-mode", { mode })
      .then((res) => { hostCtx.displayMode = (res && res.mode) || mode; renderActions(); })
      .catch((err) => logToHost("warning", `request-display-mode failed: ${err.message}`));
  });

  let contextTimer = null;
  function contextChanged() {
    if (!hostCaps.updateModelContext) return;
    clearTimeout(contextTimer);
    contextTimer = setTimeout(() => {
      const text = state.open
        ? `The user is reading "${state.open.title}" in the Research Reader${dateOf(state.open) ? `, published ${dateOf(state.open)}` : ""}.`
        : `The user is browsing the Research Reader${state.search ? `, searching for "${state.search}"` : ""}`
          + `${state.heldOnly ? ", filtered to posts mentioning tickers their portfolios hold" : ""}. `
          + `${state.posts.length} posts listed.`;
      request("ui/update-model-context", {
        content: [{ type: "text", text }],
        structuredContent: {
          panel: "research", search: state.search || null, holdings_filter: state.heldOnly,
          reading: state.open ? { title: state.open.title, slug: state.open.slug, published_at: state.open.published_at } : null,
          listed: state.posts.map((p) => ({ title: p.title, slug: p.slug, published_at: p.published_at })).slice(0, 20),
        },
      }).catch((err) => logToHost("warning", `update-model-context failed: ${err.message}`));
    }, 600);
  }

  // ---------------------------------------------------------------------------
  // Wiring
  // ---------------------------------------------------------------------------
  let searchTimer = null;
  $("search").addEventListener("input", () => { clearTimeout(searchTimer); searchTimer = setTimeout(runSearch, 350); });

  $("back").addEventListener("click", () => {
    state.open = null;
    $("post").hidden = true;
    $("browse").hidden = false;
    $("back").hidden = true;
    renderActions();
    contextChanged();
  });

  $("held").addEventListener("click", async () => {
    const next = !state.heldOnly;
    if (next && !state.tickers) {
      $("held").disabled = true;
      $("list").innerHTML = `<div class="empty">Reading your holdings…</div>`;
      try {
        await loadTickers();
      } catch (err) {
        $("list").innerHTML = `<div class="error">${esc(err.message)}</div>`;
        $("held").disabled = false;
        return;
      }
      $("held").disabled = false;
    }
    state.heldOnly = next;
    renderList();
  });

  function showError(message) {
    $("list").innerHTML = `<div class="error">${esc(message)}</div>`;
    logToHost("error", message);
  }

  let gotToolResult = false;
  function onToolResult(params) {
    try {
      const data = parseResult(params && params.result ? params.result : params);
      gotToolResult = true;
      state.posts = data.posts || [];
      state.search = data.search || "";
      if (state.search) $("search").value = state.search;
      if (data.disclaimer) $("disclaimer").textContent = data.disclaimer;
      renderList();
      renderActions();
    } catch (err) {
      showError(err.message);
    }
  }

  // ---------------------------------------------------------------------------
  // Size and handshake
  // ---------------------------------------------------------------------------
  const wrap = document.querySelector(".wrap");
  let reported = { width: 0, height: 0 };
  function reportSize(force) {
    const box = wrap.getBoundingClientRect();
    const size = { width: Math.ceil(box.width), height: Math.ceil(box.height) };
    if (!force && Math.abs(size.height - reported.height) < 2 && Math.abs(size.width - reported.width) < 2) return;
    reported = size;
    notify("ui/notifications/size-changed", size);
  }
  new ResizeObserver(() => reportSize(false)).observe(wrap);

  $("disclaimer").textContent = "Informational and educational purposes only. Not investment, legal, or tax advice, and not a recommendation or solicitation. No suitability assessment has been performed.";

  async function bootstrap() {
    if (gotToolResult) return;
    if (!canCallTools) { showError("No research was received. Ask the assistant to open the Research Reader again."); return; }
    try {
      const listing = await callTool("list_blog_posts", { page_size: 20 });
      if (gotToolResult) return;
      onToolResult({ content: [{ type: "text", text: JSON.stringify({ posts: listing.items || [], disclaimer: listing.disclaimer }) }] });
    } catch (err) {
      showError(err.message);
    }
  }

  request("ui/initialize", {
    protocolVersion: "2025-06-18",
    appInfo: { name: "financial-portfolios-ai-research", version: "__APP_VERSION__" },
    appCapabilities: { availableDisplayModes: ["inline", "fullscreen"] },
  }).then((init) => {
    hostCaps = (init && init.hostCapabilities) || {};
    applyContext(init && init.hostContext);
    canCallTools = !!hostCaps.serverTools;
    notify("ui/notifications/initialized", {});
    reportSize(true);
    renderActions();
    setTimeout(bootstrap, 2500);
  }).catch(() => {
    notify("ui/notifications/initialized", {});
  });
})();
</script>
</body>
</html>
